[package]
name = "nupy-core"
description = "yt-dlp / ffmpeg 관리와 다운로드 로직 (UI 독립)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "json", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "fs", "sync", "macros", "rt", "time"] }
tokio-util = "0.7.20"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
