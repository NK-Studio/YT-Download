<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>YT Downloader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="page-header">
        <h1 class="title">YT Downloader</h1>
        <div class="header-items" id="header-items"></div>
      </header>
      <div id="infobars"></div>
      <section class="search" id="search">
        <div class="textbox">
          <span class="textbox-icon" id="url-icon"></span>
          <input id="url" type="text" placeholder="YouTube 링크를 붙여넣으세요 (Ctrl+V)" autocomplete="off" spellcheck="false" />
          <button class="textbox-clear" id="url-clear" type="button" aria-label="지우기" hidden></button>
        </div>
        <button class="button accent" id="fetch" type="button">가져오기</button>
      </section>
      <main class="content" id="content"></main>
    </div>
    <div class="smoke" id="dialog" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
